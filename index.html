<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compta GTA RP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e8ebf3;--ok:#10b981;--ko:#ef4444;--hc:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14;--card:#141824;--tx:#e7e9f3;--mu:#8b93a7;--bd:#232a3b;--ok:#34d399;--ko:#fb7185}}
:root[data-theme="dark"]{--bg:#0b0d14;--card:#141824;--tx:#e7e9f3;--mu:#8b93a7;--bd:#232a3b;--ok:#34d399;--ko:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:1000px;margin:0 auto;padding:18px 14px 110px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 10px}
.hd{background:linear-gradient(135deg,var(--hc),color-mix(in srgb,var(--hc) 50%,#7c3aed));color:#fff;border-radius:22px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 18px 40px -20px var(--hc)}
.hd select{width:auto;max-width:210px}.bd{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin:14px 0;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--hc);color:#fff;box-shadow:0 6px 16px -6px var(--hc)}
@media(max-width:640px){.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9;margin:0;box-shadow:0 12px 30px -8px #0006}.tabs button{flex:1;padding:10px 3px;font-size:11.5px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 14px 30px -22px #0004}
.grid,form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid.big{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.kpi{position:relative;overflow:hidden;padding-left:22px}.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--hc)}
.kpi:has(b.ok)::before{background:var(--ok)}.kpi:has(b.ko)::before{background:var(--ko)}
.kpi small{display:block;color:var(--mu);text-transform:uppercase;font-size:11px;letter-spacing:.07em;font-weight:600}.kpi b{font-size:28px;letter-spacing:-.03em}
.co{cursor:pointer;border-left:6px solid var(--c);transition:.15s}.co:hover{transform:translateY(-2px)}.co h2{display:flex;gap:8px;align-items:center}
.ok{color:var(--ok)}.ko{color:var(--ko)}.mu{color:var(--mu)}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--hc);box-shadow:0 0 0 4px color-mix(in srgb,var(--hc) 22%,transparent)}
button.b{font:inherit;font-weight:600;background:var(--hc);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;width:auto}
button.b.g{background:color-mix(in srgb,var(--hc) 13%,var(--card));color:var(--hc)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}td.ok,td.ko{font-weight:600}
.x{background:none;border:0;color:var(--ko);cursor:pointer;font-size:15px;border-radius:8px;padding:4px 8px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bars{display:flex;gap:6px}.bars>div{flex:1;text-align:center}.bars .p{display:flex;gap:2px;align-items:flex-end;height:90px}.bars i{flex:1;min-height:2px;border-radius:3px 3px 0 0}
.ai{white-space:pre-wrap;line-height:1.65}
</style></head><body><div id="app"><p class="mu">Chargement…</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n)+' $';
const ROLES={patron:'Patron',comptable:'Comptable',employe:'Employé',lecteur:'Lecteur',gouverneur:'Gouverneur'};
const CATS=['Vente','Service','Salaire','Matériel','Stock','Carburant','Taxes','Autre'];
let db,user,me,admin=false,cos={},mem={},roles={},govs={},entries=[],names={},cid=null,tab='home',ft='',fc='',fq='',pq='',period='all',aiText='',pend=null,editId=null,logs=[],allow={},ban={},rperm={},mq='',kp=null;
const today=()=>new Date().toISOString().slice(0,10);
const gov=()=>!!govs[me.id];
const norm=s=>String(s||'').replace(/\D/g,'');
const allowOf=u=>{const d=norm(mem[u]?.dc);return d&&allow[d]?{...allow[d],id:d}:null};
const claimants=d=>Object.keys(mem).filter(u=>norm(mem[u]?.dc)===d);
const viaId=u=>{const a=allowOf(u);return a&&claimants(a.id).length===1?a:null};
const rlOf=(c,u)=>roles[c+'~'+u]||(viaId(u)?.cid===c?viaId(u).role:null)||null;
const rl=c=>admin?'patron':rlOf(c,me.id);
const defP=(r,k,c)=>({all:['patron','comptable','gouverneur'].includes(r),add:['patron','comptable','employe'].includes(r),del:['patron','comptable'].includes(r),amt:['patron','comptable','gouverneur'].includes(r)||!!cos[c]?.emp})[k];
const effP=(c,u,k)=>{const p=rperm[c+'~'+u];return p&&p[k]!==undefined?!!p[k]:defP(rlOf(c,u),k,c)};
const isBanned=u=>!!ban['u~'+u]||(!!norm(mem[u]?.dc)&&!!ban['d~'+norm(mem[u]?.dc)]);
const myCos=()=>Object.keys(cos).filter(c=>admin||gov()||rl(c)).sort((a,b)=>cos[a].name.localeCompare(cos[b].name));
const P=(c,k,def)=>{const p=rperm[c+'~'+me.id];return p&&p[k]!==undefined?!!p[k]:def};
const seeAll=c=>admin||gov()||P(c,'all',['patron','comptable','gouverneur'].includes(rl(c)));
const showAmt=c=>admin||gov()||P(c,'amt',seeAll(c)||!!cos[c]?.emp);
const canAdd=c=>admin||P(c,'add',['patron','comptable','employe'].includes(rl(c)));
const canDel=c=>admin||P(c,'del',['patron','comptable'].includes(rl(c)));
const cats=c=>cos[c]?.cats?.length?cos[c].cats:CATS;
const pf=id=>((mem[id]?.pn||'')+' '+(mem[id]?.nm||'')).trim();
const nm=id=>pf(id)||(id===me.id?'Moi':(names[id]||'…'));
const sum=(l,t)=>l.filter(e=>e.type===t).reduce((s,e)=>s+e.amount,0);
const ofCo=c=>entries.filter(e=>e.cid===c&&(seeAll(c)||e.uid===me.id));
const per=l=>l.filter(e=>period==='all'||(period==='month'?(e.date||'').slice(0,7)===today().slice(0,7):(Date.now()-new Date(e.date))<7*864e5));
const anyRole=u=>govs[u]||viaId(u)||Object.keys(roles).some(k=>k.endsWith('~'+u));
const pending=()=>Object.keys(mem).filter(u=>u!==me.id&&!anyRole(u)).length;
const match=(u,t)=>!t||(nm(u)+' '+(mem[u]?.dc||'')+' '+(names[u]||'')).toLowerCase().includes(t.toLowerCase());
function toast(m,ok){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;background:'+(ok?'#10b981':'#ef4444');document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

(async()=>{
 try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
 if(!db||!user){$('#app').innerHTML='<div class="card">Connecte-toi à Claude pour utiliser la compta.</div>';return}
 try{document.documentElement.dataset.theme=localStorage.getItem('th')||''}catch(e){}
 me=await user.me();admin=await user.isOwner()||await user.canEdit();
 try{const ms=await db.doc('members/'+me.id).get();if(!ms.exists)await db.doc('members/'+me.id).set({t:Date.now()})}catch(e){}
 const sub=(p,fn)=>{try{db.collection(p).onSnapshot(s=>{fn(s);names_().then(render)},()=>{})}catch(e){}};
 sub('companies',s=>{cos={};s.docs.forEach(d=>cos[d.id]=d.data())});
 sub('members',s=>{mem={};s.docs.forEach(d=>mem[d.id]=d.data())});
 sub('roles',s=>{roles={};rperm={};s.docs.forEach(d=>{const x=d.data();roles[x.cid+'~'+x.uid]=x.role;rperm[x.cid+'~'+x.uid]=x.p||{}})});
 sub('gov',s=>{govs={};s.docs.forEach(d=>govs[d.id]=1)});
 sub('allow',s=>{allow={};s.docs.forEach(d=>allow[d.id]=d.data())});
 sub('ban',s=>{ban={};s.docs.forEach(d=>ban[d.id]=1)});
 sub('entries',s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}))});
 try{db.collection('log').orderBy('ts','desc').limit(300).onSnapshot(s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{})}catch(e){}
 render();
})();
async function names_(){const ids=Object.keys(mem).filter(i=>!names[i]);if(ids.length){try{const p=await user.profiles(ids);ids.forEach(i=>names[i]=p[i]?.name||'Inconnu')}catch(e){}}}

const prow=(u,cur)=>`<tr><td>${esc(nm(u))}${names[u]&&pf(u)?`<br><small class="mu">Compte : ${esc(names[u])}</small>`:''}${mem[u]?.dc?`<br><small class="mu">Discord : ${esc(mem[u].dc)}</small>`:''}${!cur&&mem[u]?.req&&cos[mem[u].req]?`<br><small class="ok">Demande : ${esc(cos[mem[u].req].name)}</small>`:''}</td><td style="white-space:normal">${Object.keys(ROLES).map(r=>`<button class="b ${cur===r?'':'g'}" style="margin:2px;padding:6px 10px" onclick="setRole('${u}','${r}')">${ROLES[r]}</button>`).join('')}${cur?`<button class="x" title="Retirer de l'entreprise" onclick="rmRole('${u}')">✕</button>`:''}${cur?`<div style="margin-top:6px">${[['all','Voit tout'],['add','Ajoute'],['del','Supprime'],['amt','Voit les montants']].map(([k,l])=>`<label style="display:inline-flex;gap:4px;align-items:center;margin:2px 10px 2px 0;font-size:13px"><input type="checkbox" style="width:auto" ${effP(cid,u,k)?'checked':''} onchange="togglePerm('${u}','${k}')">${l}</label>`).join('')}</div>`:''}</td></tr>`;
const perSel=()=>`<select onchange="period=this.value;render()" style="width:auto;margin-bottom:10px">${[['all','Tout'],['month','Ce mois'],['week','7 derniers jours']].map(p=>`<option value="${p[0]}" ${period===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>`;
const kpi=(l,v,c)=>`<div class="card kpi"><small>${l}</small><b class="${c||''}">${v}</b></div>`;

function render(){
 if(!me)return;
 const list=myCos();let saved='';try{saved=localStorage.getItem('co')||''}catch(e){}
 if(!cid||!list.includes(cid))cid=list.includes(saved)?saved:(list[0]||null);
 const co=cid?cos[cid]:null,A=$('#app');
 document.documentElement.style.setProperty('--hc',co?.color||'#4f46e5');
 if(!admin&&isBanned(me.id)){A.innerHTML=`<div class="card" style="max-width:460px;margin:12vh auto;text-align:center"><h1>🚫</h1><h2>Accès retiré</h2><p class="mu">Ton accès à la compta a été retiré par l'administrateur.</p></div>`;return}
 if(!list.length&&!admin&&!gov()){
  if(['w-pn','w-nm','w-dc','w-co'].includes(document.activeElement?.id))return;
  const m=mem[me.id]||{};
  A.innerHTML=`<div class="card" style="max-width:480px;margin:8vh auto"><h1>💼 Compta GTA RP</h1><h2 style="margin-top:16px">Accès en attente de validation</h2><p class="mu">Indique ton prénom, ton nom et ton ID Discord. Si l'administrateur t'a enregistré, la page s'ouvre toute seule.${allowOf(me.id)&&!viaId(me.id)?" ⚠️ Cet ID est utilisé par plusieurs comptes : contacte l'administrateur.":''}</p><form onsubmit="saveWait(event)" style="grid-template-columns:1fr"><input id="w-pn" placeholder="Prénom" maxlength="30" value="${esc(m.pn||'')}" required><input id="w-nm" placeholder="Nom" maxlength="30" value="${esc(m.nm||'')}" required><input id="w-dc" inputmode="numeric" placeholder="ID Discord (17 à 20 chiffres)" maxlength="25" pattern="[0-9 ]{17,25}" value="${esc(m.dc||'')}" required><select id="w-co" required><option value="">Mon entreprise…</option>${Object.keys(cos).sort((a,b)=>cos[a].name.localeCompare(cos[b].name)).map(c=>`<option value="${c}" ${m.req===c?'selected':''}>${esc(cos[c].emoji||'')} ${esc(cos[c].name)}</option>`).join('')}</select><button class="b">Envoyer ma demande</button></form></div>`;return}
 const tabs=[];
 tabs.push(['home','🏠 Accueil']);
 if(list.length>1||admin||gov())tabs.push(['cos','💰 Chiffres']);
 if(cid)tabs.push(['dash','📊 Ma compta'],['ops','🧾 Opérations']);
 if(cid&&canDel(cid))tabs.push(['log','🕘 Journal']);
 if(admin)tabs.push(['team','👥 Équipe'+(pending()?` (${pending()})`:'')]);
 tabs.push(['me','👤 Profil']);
 if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
 const lbl=admin?'Admin':(cid?(rl(cid)?ROLES[rl(cid)]:(gov()?'Gouverneur':'')):'');
 let h=`<div class="hd"><div><h1>${co?esc(co.emoji||'💼')+' '+esc(co.name):'💼 Compta GTA RP'}</h1><span style="opacity:.85">${esc(pf(me.id)?'👋 '+mem[me.id].pn:'Comptabilité')}</span></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${list.length>1?`<select onchange="go(this.value)">${list.map(c=>`<option value="${c}" ${c===cid?'selected':''}>${esc(cos[c].emoji||'')} ${esc(cos[c].name)}</option>`).join('')}</select>`:''}${lbl?`<span class="bd">${lbl}</span>`:''}</div></div><div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;

 if(tab==='home'){
  const all=Object.keys(cos).sort((a,b)=>cos[a].name.localeCompare(cos[b].name));
  h+=`<div class="card"><h2>🏠 Les entreprises du serveur</h2><p class="mu" style="margin:0">${all.length} entreprises · clique sur la tienne pour ouvrir ta compta.</p></div><div class="grid big">${all.map(c=>{const mine=admin||gov()||rl(c),n=Object.keys(roles).filter(k=>k.startsWith(c+'~')).length;return `<div class="card co" style="--c:${cos[c].color||'#4f46e5'};${mine?'':'opacity:.65'}" onclick="openCo('${c}')"><h2><span style="font-size:28px">${esc(cos[c].emoji||'💼')}</span>${esc(cos[c].name)}</h2><div class="top"><span class="mu">👥 ${n} membre${n>1?'s':''}</span>${mine?`<span class="bd" style="background:var(--c);border:0;color:#fff">${admin?'Admin':rl(c)?ROLES[rl(c)]:'Gouverneur'}</span>`:'<span class="mu">🔒</span>'}</div></div>`}).join('')||`<div class="card mu">Aucune entreprise.</div>`}</div>`;
 }
 if(tab==='cos'){
  let R=0,D=0;const net=c=>{const l=entries.filter(e=>e.cid===c);return sum(l,'recette')-sum(l,'depense')};
  const cards=(admin||gov()?[...list].sort((a,b)=>net(b)-net(a)):list).map((c,i)=>{const l=entries.filter(e=>e.cid===c),r=sum(l,'recette'),d=sum(l,'depense'),sa=seeAll(c);if(sa){R+=r;D+=d}
   return `<div class="card co" style="--c:${cos[c].color||'#4f46e5'}" onclick="go('${c}','dash')"><h2><span style="font-size:26px">${esc(cos[c].emoji||'💼')}</span>${esc(cos[c].name)}${(admin||gov())&&i<3?' '+['🥇','🥈','🥉'][i]:''}</h2>${sa?`<div class="top"><span class="mu">Recettes</span><b class="ok">${fmt(r)}</b></div><div class="top"><span class="mu">Dépenses</span><b class="ko">${fmt(d)}</b></div><div class="top"><span class="mu">Bénéfice</span><b class="${r-d>=0?'ok':'ko'}">${fmt(r-d)}</b></div>`:`<span class="mu">${ROLES[rl(c)]||''}</span>`}</div>`}).join('');
  h+=(admin||gov()?`<div class="grid">${kpi('Recettes (toutes)',fmt(R),'ok')}${kpi('Dépenses (toutes)',fmt(D),'ko')}${kpi('Bénéfice (toutes)',fmt(R-D),R-D>=0?'ok':'ko')}</div>`:'')+`<div class="grid big">${cards||'<div class="card mu">Aucune entreprise pour l\'instant.</div>'}</div>`;
 }
 if(tab==='dash'&&cid&&!showAmt(cid)){
  const mine=ofCo(cid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0)).slice(0,10);
  if(canAdd(cid))h+=`<div class="card"><h2>💸 Ajouter une opération</h2><form onsubmit="return false" style="grid-template-columns:1fr"><input id="q-a" type="number" min="1" step="1" inputmode="numeric" placeholder="Montant $" style="font-size:22px;font-weight:700"><input id="q-d" placeholder="Note (facultatif)" maxlength="120"><input id="q-c" type="hidden"><input id="q-to" type="hidden"><div class="grid" style="grid-template-columns:1fr 1fr"><button type="button" class="b" style="background:var(--ok)" onclick="quick('recette')">➕ Entrée d'argent</button><button type="button" class="b" style="background:var(--ko)" onclick="quick('depense')">➖ Sortie d'argent</button></div></form></div>`;
  h+=`<div class="card"><h2>🕒 Mes dernières opérations</h2><p class="mu" style="margin-top:0">Les montants et les totaux sont réservés à la direction.</p>${mine.map(e=>`<div class="top" style="padding:9px 0;border-bottom:1px solid var(--bd)"><span>${e.type==='recette'?'🟢':'🔴'} ${esc(e.desc||e.cat||(e.type==='recette'?'Entrée':'Sortie'))} <small class="mu">· ${esc(e.date)}</small></span></div>`).join('')||`<p class="mu">Aucune opération.</p>`}</div>`;
 }
 if(tab==='dash'&&cid&&showAmt(cid)){
  const l=per(ofCo(cid)),rec=sum(l,'recette'),dep=sum(l,'depense'),tax=Math.max(0,rec-dep)*(co.tax||0)/100;
  h+=perSel()+`<div class="grid">${kpi('Recettes',fmt(rec),'ok')}${kpi('Dépenses',fmt(dep),'ko')}${kpi('Bénéfice',fmt(rec-dep),rec-dep>=0?'ok':'ko')}${tax>0?kpi('Impôt ('+co.tax+' %)',fmt(tax),'ko')+kpi('Net',fmt(rec-dep-tax),rec-dep-tax>=0?'ok':'ko'):''}</div>`;
  const mm=(()=>{const m=i=>{const d=new Date();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()-i);return d.toISOString().slice(0,7)},net=k=>{const x=ofCo(cid).filter(e=>(e.date||'').slice(0,7)===m(k));return sum(x,'recette')-sum(x,'depense')};return[net(0),net(1)]})();
  const gp=co.goal>0?Math.max(0,Math.min(100,Math.round(mm[0]/co.goal*100))):0;
  h+=`<div class="card"><div class="top"><h2 style="margin:0">📅 Ce mois-ci</h2><b class="${mm[0]>=0?'ok':'ko'}">${fmt(mm[0])}</b></div><p class="mu" style="margin:6px 0">${mm[1]?`${mm[0]>=mm[1]?'▲':'▼'} ${Math.abs(Math.round((mm[0]-mm[1])/Math.abs(mm[1])*100))} % par rapport au mois dernier (${fmt(mm[1])})`:'Pas de données le mois dernier'}${co.goal>0?` · Objectif : ${fmt(co.goal)}`:''}</p>${co.goal>0?`<div style="height:12px;border-radius:99px;background:var(--bd);overflow:hidden"><i style="display:block;height:100%;width:${gp}%;background:linear-gradient(90deg,var(--ok),#22d3ee);border-radius:99px"></i></div><small class="mu">${gp} % de l'objectif</small>`:''}</div>`;
  const ed=editId?entries.find(e=>e.id===editId):null;

async function rmRole(u){try{await db.doc('roles/'+cid+'~'+u).delete()}catch(e){toast('Refusé')}}
async function toggleGov(u){try{govs[u]?await db.doc('gov/'+u).delete():await db.doc('gov/'+u).set({t:Date.now()})}catch(e){toast('Refusé')}}
async function newCo(ev){ev.preventDefault();const id='c'+Date.now().toString(36);try{await db.doc('companies/'+id).set({name:$('#n-name').value.trim(),emoji:'💼',color:'#4f46e5',tax:0});cid=id;tab='team';toast('Entreprise créée ✓',true)}catch(e){toast('Refusé')}}
async function saveCo(ev){ev.preventDefault();const cs=$('#c-cats').value.split(',').map(s=>s.trim()).filter(Boolean);
 try{await db.doc('companies/'+cid).set({...cos[cid],name:$('#c-name').value.trim()||cos[cid].name,emoji:$('#c-em').value.trim()||'💼',color:$('#c-col').value,tax:Math.min(100,Math.max(0,+$('#c-tax').value||0)),goal:Math.max(0,+$('#c-goal').value||0),emp:$('#c-emp').checked,cats:cs});toast('Enregistré ✓',true)}catch(e){toast('Refusé')}}
async function saveProfile(ev){ev.preventDefault();try{await db.doc('members/'+me.id).set({...(mem[me.id]||{}),pn:$('#p-pn').value.trim(),nm:$('#p-nm').value.trim(),dc:norm($('#p-dc').value)});toast('Profil enregistré ✓',true)}catch(e){toast('Erreur, réessaie')}}
async function saveWait(ev){ev.preventDefault();try{await db.doc('members/'+me.id).set({...(mem[me.id]||{}),pn:$('#w-pn').value.trim(),nm:$('#w-nm').value.trim(),dc:norm($('#w-dc').value),req:$('#w-co').value});toast('Demande envoyée ✓',true)}catch(e){toast('Erreur, réessaie')}}
async function exp(){const r=[['Date','Type','Montant','Catégorie','Description','Par'],...ofCo(cid).map(e=>[e.date,e.type,e.amount,e.cat,e.desc,nm(e.uid)])];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 try{const d=await claude.use('downloads');if(!d)return toast('Export indisponible');await d.save({filename:'compta-'+(cos[cid]?.name||'entreprise')+'.csv',data:'\ufeff'+r.map(x=>x.map(q).join(';')).join('\n')})}catch(e){}}
async function askAI(){const sm=await claude.use('sample');if(!sm){aiText='Assistant indisponible.';render();return}
 const l=per(ofCo(cid)),cs={};l.forEach(e=>{const k=e.cat||'Autre';cs[k]=cs[k]||{recettes:0,depenses:0};cs[k][e.type==='recette'?'recettes':'depenses']+=e.amount});
 const data=JSON.stringify({entreprise:cos[cid].name,recettes:sum(l,'recette'),depenses:sum(l,'depense'),impot_pct:cos[cid].tax||0,categories:cs,dernieres:l.slice(0,40).map(e=>({date:e.date,type:e.type,montant:e.amount,cat:e.cat,desc:e.desc}))});
 aiText='Analyse en cours…';render();
 try{const r=await sm(`Tu es le conseiller comptable d'une entreprise sur un serveur GTA RP (dollars). Réponds en français, court et concret (puces, 8 lignes max) : points forts, points d'attention, 3 conseils. Données : ${data}`,{onText:({text})=>{aiText=text;const o=$('#ai-out');if(o)o.textContent=text}});aiText=r.text}catch(e){aiText=`Impossible de contacter l'assistant (${e.code||'erreur'}).`}
 render()}
</script></body></html>
